<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة تحكم جوهر</title><link rel="stylesheet" href="/style.css">
<style>body{padding:1rem}.w{max-width:960px;margin:auto}.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.f{display:grid;gap:.5rem;background:var(--bg2);padding:1rem;border-radius:12px;border:1px solid #c9a24b44;margin-bottom:1rem}.f label{color:var(--g2);font-size:.9rem}.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem;border-bottom:1px solid #c9a24b22}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}img.t{height:50px;border-radius:6px}</style></head>
<body><div class="w"><h1>لوحة تحكم جوهر</h1><div id="r"></div></div>
<script>
const $=s=>document.querySelector(s),L=['ar','tr','en'],LN={ar:'العربية',tr:'Türkçe',en:'English'};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,b)=>fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const CAT={men:'عطور رجالية',women:'عطور نسائية',makeup:'مكياجات',oriental:'عطور شرقية',western:'عطور غربية',luxury:'عطور فاخرة'},LK={whatsapp:'قناة واتساب',tiktok:'تيك توك',youtube:'يوتيوب',instagram:'إنستغرام'};
let DB,tab='product',ed=null;
async function boot(){if(!(await api('me')).ok)return $('#r').innerHTML=`<div class="f"><label>اسم المستخدم</label><input id="u" autocomplete="username"><label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password"><button class="btn" onclick="login()">دخول</button><b id="m" style="color:#e66"></b></div>`;DB=await api('public');show()}
async function login(){const r=await api('login',{u:$('#u').value,p:$('#p').value});r.ok?boot():$('#m').textContent='بيانات الدخول غير صحيحة'}
function show(){const T={product:'المنتجات',branch:'الفروع',link:'روابط التواصل',content:'المحتوى',acc:'الحساب'};
$('#r').innerHTML=`<div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="btn ${tab===k?'':'o'}" onclick="tab='${k}';ed=null;show()">${v}</button>`).join('')}<a class="btn o" href="/" target="_blank">الموقع</a><button class="btn o" onclick="api('logout',{}).then(boot)">خروج</button></div><div id="b"></div>`;
({product:prod,branch:br,link:lk,content:ct,acc:ac})[tab]()}
async function up(inp){const f=inp.files[0];if(!f)return;const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});const r=await api('admin/upload',{name:f.name,data:b});if(r.url){inp.previousElementSibling.value=r.url}else alert('فشل الرفع (jpg/png/webp/svg حتى 6MB)')}
const img=(id,v)=>`<input id="${id}" value="${e(v||'')}" placeholder="رابط الصورة"><input type="file" accept="image/*" onchange="up(this)">`;
const ml=(id,o,ta)=>`<div class="g4">${L.map(l=>`<div><label>${LN[l]}</label>${ta?`<textarea rows=3 id="${id}_${l}" style="width:100%">${e((o||{})[l])}</textarea>`:`<input id="${id}_${l}" style="width:100%" value="${e((o||{})[l])}">`}</div>`).join('')}</div>`;
const gl=id=>Object.fromEntries(L.map(l=>[l,$('#'+id+'_'+l).value]));
async function save(t,d,id){await api('admin/item',{t,d,id});DB=await api('public');ed=null;show()}
async function del(id){if(confirm('تأكيد الحذف؟')){await api('admin/delete',{id});DB=await api('public');show()}}
function prod(){const p=ed&&ed!=='n'?DB.items.product.find(x=>x.id===ed):{};
$('#b').innerHTML=(ed?`<div class="f"><label>اسم المنتج</label>${ml('n',p.name)}<label>الوصف</label>${ml('d',p.desc,1)}<label>المكونات / النوتات العطرية</label>${ml('o',p.notes,1)}<label>التصنيف</label><select id="c">${Object.entries(CAT).map(([k,v])=>`<option value="${k}" ${p.cat===k?'selected':''}>${v}</option>`).join('')}</select><label><input type="checkbox" id="fe" ${p.featured?'checked':''}> مميز</label><label><input type="checkbox" id="nw" ${p.new?'checked':''}> جديد</label><label>الصورة الرئيسية</label>${img('im',p.img)}<label>صور إضافية (أرسلها واحدة تلو الأخرى عبر الحقل ثم افصل بفاصلة)</label><input id="ims" value="${e((p.imgs||[]).join(','))}"><input type="file" accept="image/*" onchange="up(this).then(()=>{const a=$('#ims');a.value=(a.value?a.value+',':'')+this.previousElementSibling.value})"><button class="btn" onclick="save('product',{name:gl('n'),desc:gl('d'),notes:gl('o'),cat:$('#c').value,featured:+$('#fe').checked,new:+$('#nw').checked,img:$('#im').value,imgs:$('#ims').value.split(',').filter(Boolean)},${ed==='n'?'null':ed})">حفظ</button></div>`:`<button class="btn" onclick="ed='n';prod()">+ إضافة منتج</button>`)+DB.items.product.map(x=>`<div class="row"><span>${x.img?`<img class="t" src="${e(x.img)}"> `:''}${e((x.name||{}).ar||(x.name||{}).en)} <small>${CAT[x.cat]}</small></span><span><button class="btn o" onclick="ed=${x.id};prod()">تعديل</button> <button class="btn o" onclick="del(${x.id})">حذف</button></span></div>`).join('')}
function br(){const p=ed&&ed!=='n'?DB.items.branch.find(x=>x.id===ed):{};
$('#b').innerHTML=(ed?`<div class="f"><label>اسم الفرع</label>${ml('n',p.name)}<label>المدينة</label>${ml('c',p.city)}<label>العنوان</label>${ml('a',p.addr,1)}<label>رابط خرائط Google</label><input id="mp" value="${e(p.map||'')}"><label>صورة الفرع</label>${img('im',(p.imgs||[])[0])}<button class="btn" onclick="save('branch',{name:gl('n'),city:gl('c'),addr:gl('a'),map:$('#mp').value,imgs:[$('#im').value].filter(Boolean)},${ed==='n'?'null':ed})">حفظ</button></div>`:`<button class="btn" onclick="ed='n';br()">+ إضافة فرع</button>`)+DB.items.branch.map(x=>`<div class="row"><span>${e((x.name||{}).ar||(x.name||{}).en)}</span><span><button class="btn o" onclick="ed=${x.id};br()">تعديل</button> <button class="btn o" onclick="del(${x.id})">حذف</button></span></div>`).join('')}
function lk(){$('#b').innerHTML=DB.items.link.map(x=>`<div class="f"><b>${LK[x.key]}</b><input id="u${x.id}" value="${e(x.url)}" dir="ltr"><div><label><input type="checkbox" id="o${x.id}" ${x.on?'checked':''}> ظاهر</label> <label><input type="checkbox" id="f${x.id}" ${x.footer?'checked':''}> في الفوتر</label> <label><input type="checkbox" id="c${x.id}" ${x.contact?'checked':''}> في التواصل</label> <label>الترتيب <input type="number" id="r${x.id}" value="${x.order}" style="width:70px"></label></div><button class="btn" onclick="save('link',{key:'${x.key}',url:$('#u${x.id}').value,on:+$('#o${x.id}').checked,footer:+$('#f${x.id}').checked,contact:+$('#c${x.id}').checked,order:+$('#r${x.id}').value},${x.id})">حفظ</button></div>`).join('')}
function ct(){const c=DB.content,ks=['tag','welcome','about_t'],n={tag:'العبارة الرئيسية',welcome:'العبارة الترحيبية',about_t:'نص من نحن'};
$('#b').innerHTML=`<div class="f"><label>الشعار</label>${img('lg',c.logo)}<label>صورة الصفحة الرئيسية</label>${img('hr',c.hero)}</div><div class="f">${ks.map(k=>`<label>${n[k]} (اتركه فارغاً لاستخدام النص الافتراضي)</label>${ml(k,Object.fromEntries(L.map(l=>[l,c[l+'.'+k]||''])),1)}`).join('')}<button class="btn" onclick="sc()">حفظ</button></div>`}
async function sc(){const o={logo:$('#lg').value,hero:$('#hr').value};['tag','welcome','about_t'].forEach(k=>L.forEach(l=>o[l+'.'+k]=$('#'+k+'_'+l).value));await api('admin/content',o);DB=await api('public');alert('تم الحفظ')}
function ac(){$('#b').innerHTML=`<div class="f"><label>اسم المستخدم الجديد</label><input id="nu"><label>كلمة المرور الجديدة (12 حرفاً على الأقل)</label><input id="np" type="password"><button class="btn" onclick="api('admin/account',{u:$('#nu').value,p:$('#np').value}).then(r=>alert(r.ok?'تم التغيير':'بيانات ضعيفة'))">تغيير</button></div>`}
boot()
</script></body></html>
